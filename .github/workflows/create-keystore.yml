name: Create upload keystore (run ONCE)
on:
  workflow_dispatch:
    inputs:
      password:
        description: "Choose a password (min 8 chars, letters/numbers only)"
        required: true
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KS_PASS: ${{ inputs.password }}
        run: |
          keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=War Room, O=Self, C=US"
          base64 -w0 upload.jks > upload.jks.base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KEEP-PRIVATE-keystore
          path: |
            upload.jks
            upload.jks.base64.txt
